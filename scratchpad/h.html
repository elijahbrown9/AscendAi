<title>ASCEND — Risk Terminal</title>
<style>
  :root{
    --bg:#0B0E14; --panel:#141A26; --panel2:#0F1420; --line:#232B3B;
    --ink:#E8E4D8; --dim:#8A93A6; --faint:#525C70;
    --amber:#F5A623; --off:#E4574C; --on:#3FA96F; --neutral:#7E8BA3;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);margin:0;
    font:14px/1.55 ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
  .num{font-variant-numeric:tabular-nums}
  header{display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid var(--line);padding-bottom:12px;flex-wrap:wrap;gap:6px}
  .logo{font-size:17px;font-weight:700;letter-spacing:.14em}
  .logo em{color:var(--amber);font-style:normal}
  .stamp{color:var(--dim);font-size:12px}
  .verdict{margin:20px 0 8px;background:var(--panel);border:1px solid var(--line);
    border-left:4px solid var(--neutral);padding:18px 20px;display:flex;
    justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
  .verdict h1{margin:0;font-size:30px;letter-spacing:.06em;color:var(--neutral);text-wrap:balance}
  .verdict .sub{color:var(--dim);font-size:12.5px;max-width:56ch}
  .score{font-size:13px;color:var(--dim);text-align:right}
  .score b{color:var(--ink);font-size:22px}
  .gauge{margin:14px 0 6px}
  .gauge .track{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .gauge .seg{height:34px;display:flex;align-items:center;justify-content:center;
    font-size:10.5px;letter-spacing:.08em;color:var(--faint);
    background:var(--panel2);border:1px solid var(--line)}
  .gauge .seg.active{color:#0B0E14;font-weight:700;background:var(--neutral);border-color:var(--neutral)}
  .gauge .lbl{display:flex;justify-content:space-between;color:var(--faint);
    font-size:10px;letter-spacing:.1em;margin-top:6px}
  .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
  .grid.even{grid-template-columns:1fr 1fr}
  .grid.full{grid-template-columns:1fr}
  @media(max-width:780px){.grid,.grid.even{grid-template-columns:1fr}}
  section{background:var(--panel);border:1px solid var(--line);padding:16px 18px}
  section h2{margin:0 0 4px;font-size:12px;letter-spacing:.14em;color:var(--amber)}
  section .w{color:var(--faint);font-size:10.5px;letter-spacing:.08em}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
  th{text-align:left;color:var(--faint);font-weight:400;font-size:10.5px;
    letter-spacing:.1em;padding:0 8px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:7px 8px 7px 0;border-bottom:1px solid var(--panel2);vertical-align:top}
  tr:last-child td{border-bottom:none}
  td.r,th.r{text-align:right;padding-right:0}
  .chip{display:inline-block;padding:1px 8px;font-size:10.5px;letter-spacing:.06em;border:1px solid;white-space:nowrap}
  .c-off{color:var(--off);border-color:var(--off)}
  .c-on{color:var(--on);border-color:var(--on)}
  .c-n{color:var(--neutral);border-color:var(--neutral)}
  .c-a{color:var(--amber);border-color:var(--amber)}
  .c-x{color:var(--faint);border-color:var(--faint)}
  .dim{color:var(--dim)} .faint{color:var(--faint);font-size:11.5px}
  .neg{color:var(--off)} .pos{color:var(--on)}
  .posture{margin-top:14px;border-left:3px solid var(--amber);
    background:var(--panel2);padding:12px 14px;font-size:13px}
  .posture b{color:var(--amber)}
  .posture.bad{border-left-color:var(--off)} .posture.bad b{color:var(--off)}
  .posture.good{border-left-color:var(--on)} .posture.good b{color:var(--on)}
  footer{margin-top:22px;color:var(--faint);font-size:11px;line-height:1.7;
    border-top:1px solid var(--line);padding-top:12px}
  footer code{color:var(--dim)}
  .tabs{display:flex;gap:6px;margin:18px 0 0;flex-wrap:wrap}
  .tabbtn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:11px;letter-spacing:.12em;padding:8px 15px;cursor:pointer}
  .tabbtn:hover{color:var(--ink);border-color:var(--faint)}
  .tabbtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .tabbtn.active{background:var(--amber);border-color:var(--amber);color:#0B0E14;font-weight:700}
  .tabpane{display:none} .tabpane.active{display:block}
  .tabpane .grid{margin-top:14px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
